openapi: 3.0.3
info:
  title: MoEngage SMS Template API
  version: '1.0'
  description: API for creating, updating, and searching SMS templates within the MoEngage platform.
tags:
  - name: SMS Templates
    description: Operations to manage SMS templates.
servers:
  - url: 'https://api-0{dc}.moengage.com/v1.0'
    description: MoEngage Custom Templates API Server
    variables:
      dc:
        default: '1'
        description: 'Your MoEngage Data Center (DC). Can be 1, 2, 3, etc.'
        enum:
          - '1'
          - '2'
          - '3'
          - '4'
security:
  - basicAuth: []

paths:
  /custom-templates/sms:
    post:
      tags:
        - SMS Templates
      summary: Create SMS Template
      description: |
        The Create SMS Template API can be used to create an SMS template in MoEngage.
        This API helps you upload templates created outside the MoEngage ecosystem to
        MoEngage and use them for campaign creation.
      x-mint:
        content: |
          ### Rate Limit & Quota
          The rate limit is **100 RPM** (Requests Per Minute). You can upload a maximum of **100 templates** per channel.
      requestBody:
        required: true
        description: The details of the SMS template to be created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSmsTemplateRequest'
            example:
              basic_details:
                message: "Hello {{UserAttribute['first_name']}}, your order is on its way!"
              meta_info:
                created_by: "john.doe@example.com"
                template_id: "shipping_update_v1"
                template_name: "Shipping Update Template"
                template_version: "1"
      responses:
        '200':
          description: Template created successfully. This response is returned when the request is processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_template_id:
                    type: string
                    format: uuid
                    description: The unique ID assigned to the newly created template by MoEngage.
                    example: "d05a44f0-a7cf-471a-bcb6-63054800a367"
        '400':
          description: |
            Bad Request. This response is returned when the required parameters are missing
            from the request, when the provided parameters are invalid, or when a template already exists with the same version, name, or id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                DuplicateTemplate:
                  summary: Template ID/Version Conflict
                  value:
                    error:
                      code: "400 Bad Request"
                      message: "Duplicate - template_id and template_version"
                      details:
                        - code: "InvalidValue"
                          target: "Duplicate - template_id and template_version"
                          message: "template_id:basicios12 template_version:12 is already present."
                      request_id: "cLCcgLQj"
        '401':
          description: Authorization Failure. This response is returned when the authorization parameters are missing in the HTTP Auth Header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MissingAuthHeader:
                  summary: Missing Authorization Header
                  value:
                    title: "Authentication required"
                    description: "MOE-APPKEY missing in Authentication Header"
        '403':
          description: Unauthorized Access. This response is returned when the authorization fails due to incorrect values for the APP KEY/ HTTP Auth Header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidAppSecret:
                  summary: Invalid App Secret Key
                  value:
                    error:
                      code: "403 Forbidden"
                      message: "Authentication required"
                      details:
                        - code: "InvalidValue"
                          target: "APP_SECRET_KEY"
                          message: "Invalid APP_SECRET_KEY is provided."
                      request_id: "oZEMYhqA"
        '415':
          description: Unsupported File Type. This response is returned when the header Content-Type is not provided/is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UnsupportedMediaType:
                  summary: Unsupported Content-Type
                  value:
                    title: "Unsupported media type"
                    description: "Content type is not supported"
        '429':
          description: Rate Limit Breach. This response is returned when the number of requests per minute has exceeded the rate limit or the number of templates has exceeded the allowed quota per channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                RateLimitBreach:
                  summary: Rate Limit Exceeded
                  value:
                    title: "Request limit reached"
                    description: "This API call has exceeded the rate limit"
                    code: "KMxkunyz"
        '5XX':
          description: Internal Server Error. This response is returned when the system runs into an unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InternalServerError:
                  summary: Unexpected System Error
                  value:
                    title: "Internal Server Error"
                    message: "An unexpected error was encountered while processing this request. Please contact MoEngage Team"
    put:
      tags:
        - SMS Templates
      summary: Update SMS Template
      description: |
        This API can be used to update an SMS template by specifying its `external_template_id`.
        You can specify whether the updated version of the template can be used in active campaigns in the request.
      x-mint:
        content: |
          ### Rate Limit
          The rate limit is **100 RPM** (Requests Per Minute).
      requestBody:
        required: true
        description: The updated details for the SMS template.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSmsTemplateRequest'
            example:
              external_template_id: "d05a44f0-a7cf-471a-bcb6-63054800a367"
              update_campaigns: false
              basic_details:
                message: "Hi {{UserAttribute['first_name']}}, your order has been delivered!"
              meta_info:
                template_name: "Shipping Update Template V2"
                updated_by: "jane.doe@example.com"
                template_version: "2"
      responses:
        '200':
          description: Template updated successfully. This response is returned when the request is processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_template_id:
                    type: string
                    format: uuid
                    description: This field contains the unique template id corresponding to a successful template updation request.
                    example: "eca024b7-a8ea-4f31-9154-5b80c85d18a9"
        '400':
          description: This response is returned when the required parameters are missing from the request or when the provided parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: Internal Server Error. This response is returned when the system runs into an unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /custom-templates/sms/search:
    post:
      tags:
        - SMS Templates
      summary: Search SMS Templates
      description: The Search SMS Template API can be used to look up the SMS templates created in your MoEngage account based on specified filter criteria.
      x-mint:
        content: |
          <Note>
            We are introducing **mandatory pagination**, effective November 15, 2025. All calls to this API must include `page` and `entries` parameters. Requests submitted without them after the effective date will result in an error.
            
            ### Rate Limit
            The rate limit is **100 RPM** (Requests Per Minute).
          </Note>
      requestBody:
        required: true
        description: Search filters for finding SMS templates.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchSmsTemplateRequest'
            example:
              page: 1
              entries: 10
              template_source: ["API"]
              sort_params:
                - last_modified_date: "DESCENDING"
      responses:
        '200':
          description: Search successful. This response is returned when the request is processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSmsTemplateResponse'
        '400':
          description: |
            Bad Request. This response is returned when the required parameters are missing
            from the request or when the provided parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate Limit Breach. This response is returned when the number of requests per minute has exceeded the rate limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: Internal Server Error. This response is returned when the system runs into an unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Basic Authentication using **Workspace ID** as username and the 'Campaign report/Business events/Custom templates' **API key** as the password.

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          description: This field contains the reason for the request's failure.
          properties:
            code:
              type: string
              description: The error code that provides a brief explanation of the error (e.g., "400 Bad Request").
              example: "400 Bad Request"
            message:
              type: string
              description: This field describes why the request has failed.
              example: "Duplicate - template_id and template_version"
            details:
              type: array
              description: A list of error detail objects.
              items:
                type: object
                properties:
                  code: { type: string, example: "InvalidValue" }
                  target: { type: string, description: "Denotes the field causing the issue or a brief description of the error message.", example: "Duplicate - template_id and template_version" }
                  message: { type: string, example: "template_id:BasicTemplate1 template_version:1 is already present." }
            request_id:
              type: string
              description: The unique ID pertaining to the request.
              example: "cLCcgLQj"
        title:
          type: string
          description: An alternative error title format (used for Auth failure).
          example: "Authentication required"
        description:
          type: string
          description: An alternative error description format.
          example: "MOE-APPKEY missing in Authentication Header"
        code:
          type: string
          description: The main error code (alternative format).
          example: "KMxkunyz"

    CreateSmsTemplateRequest:
      type: object
      required:
        - basic_details
        - meta_info
      properties:
        basic_details:
          type: object
          description: This field contains the basic details of the SMS template.
          required:
            - message
          properties:
            message:
              type: string
              description: The content of the SMS message. (Mandatory String)
        meta_info:
          type: object
          description: |
            This field contains information about the template being created, such as the name, version,
            and id of the template and the creator's details. All fields are mandatory Strings.
          required:
            - created_by
            - template_id
            - template_name
            - template_version
          properties:
            created_by:
              type: string
              description: Details about who created the template (provided by you).
            template_id:
              type: string
              description: A unique ID for the template (provided by you).
            template_name:
              type: string
              description: The name of the template, used for identifying the template (provided by you).
            template_version:
              type: string
              description: The version of the template, used for tracking (provided by you).

    UpdateSmsTemplateRequest:
      type: object
      required:
        - external_template_id
        - basic_details
        - meta_info
      properties:
        external_template_id:
          type: string
          format: uuid
          description: The unique ID generated by MoEngage during template creation. (Mandatory)
        update_campaigns:
          type: boolean
          default: false
          description: |
            If true, updates all active campaigns using this template to the newer version
            (that is being updated in this request). The default value is false. (Optional)
        basic_details:
          type: object
          description: This field contains the updated basic details of the SMS template.
          required:
            - message
          properties:
            message:
              type: string
              description: The updated content of the SMS message. (Mandatory String)
        meta_info:
          type: object
          description: |
            This field contains information about the template being updated.
            Fields `template_name` and `updated_by` are mandatory. `template_version` is optional.
          required:
            - template_name
            - updated_by
          properties:
            template_name:
              type: string
              description: The name of the template being updated.
            updated_by:
              type: string
              format: email
              description: The email ID of the person updating the template.
            template_version:
              type: string
              description: Optional new version for the template.

    SearchSmsTemplateRequest:
      type: object
      description: All fields are optional. An empty request body will fetch all templates.
      properties:
        page:
          type: integer
          description: The page number of the results to fetch.
          default: 1
        entries:
          type: integer
          description: The number of templates to return per page.
          maximum: 15
          default: 15
        template_name:
          type: string
          description: The name of the template to search for (When specified, the template that matches the name specified in this field will be returned).
        template_source:
          type: array
          description: |
            This field indicates the template source that created the template. Allowed values: [API, MOENGAGE].
          items:
            type: string
            enum: [API, MOENGAGE]
        template_type:
          type: array
          description: This field indicates whether the template is a custom one or a pre-built one. Allowed values: [CUSTOM, PRE_BUILT].
          items:
            type: string
            enum: [CUSTOM, PRE_BUILT]
        created_by:
          type: array
          description: This field indicates the user who created the template (e.g., ["user1@moengage.com"]).
          items:
            type: string
            format: email
        updated_by:
          type: array
          description: This field indicates the user who updated the template (e.g., ["user1@moengage.com"]).
          items:
            type: string
            format: email
        sort_params:
          type: array
          description: This field indicates the sorting parameters for the search result and the sort order.
          items:
            type: object
            properties:
              template_name:
                type: string
                enum: [ASCENDING, DESCENDING]
              last_modified_date:
                type: string
                enum: [ASCENDING, DESCENDING]
              last_modified_by:
                type: string
                enum: [ASCENDING, DESCENDING]
        template_ids:
          type: array
          description: |
            This field indicates the list of the template IDs that must be fetched. Can include specific versions.
            Example: [{"external_template_id": "e1c95cb8-4f15-4f22-ae73-e9f47c9925c8", "version": 1}]
          items:
            type: object
            properties:
              external_template_id:
                type: string
                format: uuid
              version:
                type: integer

    SmsTemplate:
      type: object
      properties:
        external_template_id:
          type: string
          format: uuid
        version:
          type: integer
        basic_details:
          type: object
          properties:
            message:
              type: string
              description: The SMS content sent to the user.
        meta_info:
          type: object
          properties:
            template_id: { type: string }
            template_name: { type: string }
            template_version: { type: string }
            created_by: { type: string }
            channel: { type: string, example: "SMS" }
            template_type: { type: string, enum: [CUSTOM, PRE_BUILT], description: "Indicates whether the template is a custom or pre-built one." }
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_by:
          type: string
        updated_at:
          type: string
          format: date-time

    SearchSmsTemplateResponse:
      type: object
      properties:
        data:
          type: array
          description: This field contains the list of SMS templates that satisfy the search criteria.
          items:
            $ref: '#/components/schemas/SmsTemplate'
        title:
          type: string
          description: A brief description of the error (present on failure).
        description:
          type: string
          description: A detailed description of the error (present on failure).
        code:
          type: string
          description: The error code (present on failure).
        message:
          type: string
          description: The error message (present on failure).